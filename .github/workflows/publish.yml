# Publish glossr to PyPI when a version tag is pushed:
#   1. bump `version` in pyproject.toml, commit
#   2. git tag v0.1.0 && git push origin v0.1.0
# Uses PyPI Trusted Publishing (no API token stored in the repo).
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches pyproject version
        shell: bash
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version"; exit 1
          fi
      - run: uv build
      - name: Smoke-test the built wheel
        shell: bash
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/gloss --help
          /tmp/smoke/bin/glossr --help
          /tmp/smoke/bin/python -c "import gloss, pathlib; p = pathlib.Path(gloss.__file__).parent; assert (p / 'static' / 'index.html').exists(), 'frontend missing'; assert (p / '_workspace' / 'CLAUDE.md').exists(), 'workspace missing'"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/glossr
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
