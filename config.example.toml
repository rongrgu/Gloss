# Copy to config.toml (not committed) and edit.

# Model for everything, unless [llm.models] below picks one per use. For claude: an alias ("haiku",
# "sonnet", "opus") or a full name; Pro users may prefer "haiku" or "sonnet". codex ignores Claude
# aliases and uses its own default; openai_api falls back to "gpt-5.5".
model = "sonnet"

# How many Claude calls may run at once (different slides). Calls on the same slide always queue.
concurrency = 2

# Language for explanations and answers. By default it follows the interface language you pick
# in the app (中文 / EN). Set it to pin a language regardless of the interface, e.g. English UI
# with Chinese explanations.
# language = "中文"

# Let answers look things up in the rest of the course (other slides, the transcript) when a
# question needs it. Uses a bit more quota on those questions. Set to false to answer from the
# current slide only.
qa_retrieval = true

# Pre-quiz (exam practice from a course folder): reads many slides, so it uses more quota than
# a question. Pick a different model for it if you like, e.g. a stronger one than for Q&A.
# quiz_model = "sonnet"
# After generating, check every answer key against the slides with a second call; questions
# that fail are marked "needs review". Set to false to skip the check and save quota.
quiz_verify = true

# Study memory: "Finish lecture" has Claude summarize what you asked and where you are still stuck;
# a course-wide study profile keeps those weak points by concept. Pick a model for the summaries:
# digest_model = "sonnet"
# Mention relevant weak points (at most three, only when the slide is related) in new explanations
# and new question sessions. Set to false to keep explanations and answers independent of the profile.
use_profile = true

# Where newly imported courses (.gloss files) are saved.
# library = "~/Gloss"

# Path to the claude executable, if it is not on PATH.
# claude_bin = "/usr/local/bin/claude"
# Path to the codex executable (provider "codex"), if it is not on PATH.
# codex_bin = "/usr/local/bin/codex"

# --- Which LLM answers (DESIGN.md §6) -------------------------------------------------------
[llm]
# claude:        your logged-in Claude Code (`claude`), counted against your Claude plan.
# codex:         your logged-in OpenAI Codex CLI (`codex`), counted against your ChatGPT / Codex plan.
#                Not yet tested against a real Codex; see DESIGN.md §6.
# anthropic_api: the Anthropic API, billed per token to the key in ANTHROPIC_API_KEY
#                (`pip install 'glossr[anthropic]'`).
# openai_api:    the OpenAI API, billed per token to the key in OPENAI_API_KEY
#                (`pip install 'glossr[openai]'`).
# The API providers can't search the rest of the course or make pre-quizzes (no tools), and they
# resend the slide's history with every question (prompt caching keeps the repeated part cheap).
# API keys are read from the environment only: never put them in this file.
provider = "claude"
# codex only: "login" uses the CLI's own login (default); "api_key" lets codex bill CODEX_API_KEY.
# codex_auth = "login"

# Optional: a model per use. Empty means `model` above (or the provider's default).
[llm.models]
outline = ""   # mind map and transcript alignment
explain = ""   # slide explanations
qa = ""        # questions and follow-ups
digest = ""    # lecture summaries and study-profile updates (older name: digest_model)
quiz = ""      # pre-quiz generation and checking (older name: quiz_model)
