[project]
name = "gloss"
version = "0.1.0"
description = "Ask questions right on your lecture slides. A local study app powered by your own Claude."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "pymupdf>=1.24",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
gloss = "gloss.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/gloss"]

# Runtime prompts ship inside the package; installed copies seed ~/.gloss/workspace (config.py).
[tool.hatch.build.targets.wheel.force-include]
"claude_workspace/CLAUDE.md" = "gloss/_workspace/CLAUDE.md"
"claude_workspace/prompts" = "gloss/_workspace/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
