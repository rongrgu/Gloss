[project]
name = "gloss"
version = "0.1.0"
description = "Ask questions right on your lecture slides. A local study app powered by your own Claude."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/gloss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
