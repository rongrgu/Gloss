[project]
name = "glossr"
version = "0.3.1"
description = "Ask questions right on your lecture slides. A local study app powered by your own Claude."
readme = "README.md"
license = "FSL-1.1-ALv2"
requires-python = ">=3.11"
keywords = ["study", "lecture slides", "claude", "learning", "pdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "fastapi>=0.143.0",
    "pymupdf>=1.24",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/rongrgu/gloss"
Issues = "https://github.com/rongrgu/gloss/issues"

# The distribution is named glossr ("gloss" is taken on PyPI); the package and command stay gloss.
# Both commands exist so `uvx glossr` works without `--from`.
[project.scripts]
gloss = "gloss.cli:main"
glossr = "gloss.cli:main"

[project.optional-dependencies]
# API providers (DESIGN.md §6); the CLI providers need neither.
anthropic = [
    "anthropic>=1.13.0",
]
openai = [
    "openai>=2.0",
]
api = [  # the name before there were two API providers
    "anthropic>=1.13.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/frontend", "/scripts", "/.github"]

[tool.hatch.build.targets.wheel]
packages = ["backend/gloss"]

# Runtime prompts ship inside the package; installed copies seed ~/.gloss/workspace (config.py).
[tool.hatch.build.targets.wheel.force-include]
"claude_workspace/CLAUDE.md" = "gloss/_workspace/CLAUDE.md"
"claude_workspace/prompts" = "gloss/_workspace/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
